<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Notes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #eef1f6; min-height: 100vh; padding: 40px 16px; color: #1d1d1f; }
  .container { max-width: 1100px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  h1 { font-size: 22px; font-weight: 700; }
  .subtitle { color: #6e6e73; font-size: 13px; margin-top: 3px; }

  .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #6e6e73; margin-bottom: 10px; }

  .empty-state { padding: 32px 18px; font-size: 14px; color: #aeaeb2; text-align: center; }

  .results-wrap { border-radius: 16px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.09); }
  table { width: 100%; border-collapse: collapse; }

  thead tr { background: #1d2b3a; }
  thead th { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #a0b0c0; padding: 13px 16px; text-align: left; }
  thead th.th-date { width: 115px; }
  thead th.th-name { width: 210px; }
  thead th.th-disc { color: #7ec8f0; }
  thead th.th-acts { color: #f0b96e; }

  tbody tr { border-bottom: 1px solid rgba(0,0,0,.05); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:nth-child(odd)  { background: #ffffff; }
  tbody tr:nth-child(even) { background: #f7f8fb; }
  tbody tr:hover { background: #edf4ff; }

  td { padding: 14px 16px; font-size: 13px; vertical-align: top; line-height: 1.65; }

  td.date-col { white-space: nowrap; }
  .date-badge { display: inline-block; background: #e8f0fe; color: #1a56c4; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; letter-spacing: .02em; }

  td.name-col { font-weight: 600; }
  .name-badge { display: inline-block; background: #1d2b3a; color: #e2eaf2; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 8px; line-height: 1.4; }

  td.disc-col { background: rgba(100,180,240,.07); border-left: 3px solid #7ec8f0; }
  td.disc-col ul.bullets li::before { color: #5aabdc; }

  td.acts-col { background: rgba(240,180,80,.07); border-left: 3px solid #f0b96e; }
  td.acts-col ul.bullets li::before { color: #e09030; }
  td.acts-col ul.bullets li { color: #3a2800; }

  ul.bullets { list-style: none; padding: 0; }
  ul.bullets li { padding-left: 15px; position: relative; margin-bottom: 4px; }
  ul.bullets li::before { content: "•"; position: absolute; left: 0; font-weight: 700; }
  ul.bullets li:last-child { margin-bottom: 0; }
  .none { color: #aeaeb2; font-style: italic; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Meeting Notes</h1>
      <div class="subtitle">Generated by Zoom Transcript Processor</div>
    </div>
  </header>

  <div class="section-label">All Processed Meetings</div>
  <div class="results-wrap">
    <table>
      <thead>
        <tr>
          <th class="th-date">Date</th>
          <th class="th-name">Meeting</th>
          <th class="th-disc">Discussion / Summary</th>
          <th class="th-acts">My Action Items</th>
        </tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>
  </div>
</div>

<script>
  const DATA = [
  {
    "folder": "DIV <101> Yashi meeting (2026-05-21)",
    "filename": "meeting_saved_closed_caption.txt",
    "date": "2026-05-21",
    "meeting_name": "DIV <101> Yashi meeting",
    "discussion": [
      "Explored using Wisdom AI and Claude to build a web app as an alternative to Tableau for data presentation needs",
      "Reviewed the email dashboard and identified improvements around visual appeal, percentage displays, and campaign matching with fuzzy match confidence scores",
      "Discussed campaign name matching challenges due to historical Salesforce name changes, and agreed to provide metrics on match percentages across high/medium/low/no-match buckets",
      "Reviewed a UTM mapping deck covering where UTM changes are implemented across dashboards, with plans to share it with Chris and Daniel for review",
      "Discussed hosting requirements for a new accounts and contacts dashboard web app, agreeing to consult Chris on appropriate solutions and avoid personal repositories",
      "Div set a deadline of end of month for Yashi to fully understand the QBR deck, including underlying metrics, SQL logic, snapshotted data, and core marketing business concepts"
    ],
    "my_action_items": [
      "Explore feasibility of building a web app using Wisdom AI or similar tools (not Tableau) and provide an update early next week",
      "Run the email dashboard through Claude for visual and data improvement suggestions, especially around percentage displays and data cuts, and implement recommended changes",
      "Follow up with Daniel on campaign name mapping and attribute value logic, and coordinate with Daniela on product pillar and marketability fields moving through QA",
      "Post in the COE Slack channel the latest campaign mapping documentation, including percentage of data matched in each fuzzy match bucket (high, medium, low, no match) over the last 6-12 months, with email volume per bucket; tag Daniel in the update",
      "Pass the UTM mapping deck to Chris for a quick review, then share with Daniel",
      "Share any email dashboard logic changes with Raja as the dashboard moves to production",
      "Begin building the accounts and contacts dashboard/web app using available Salesforce data, starting with wireframes; wait for additional tables from Suraj next week",
      "Check with Chris (and Raj) about appropriate hosting solutions for the new web app, ensuring it is not hosted on personal repositories",
      "Review the finalized QBR deck thoroughly, including all underlying dashboards, SQL/logic used by Mayank, and all metrics and data sources; ask questions to Div or Mayank as needed and achieve full clarity within 1-2 weeks",
      "Once Snowflake MCP is connected, experiment with paid channel data (LinkedIn, Google, Meta/Facebook) to determine key metrics and how to expose this data to the digital team, in coordination with Raj",
      "Prepare for integrating and exposing Adobe data to the digital team after paid channel data work is complete",
      "Collate and contribute to the running list of AI initiatives as requested by Div"
    ],
    "processed_at": "2026-05-26T16:26:28.825974"
  }
];

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function bulletList(items) {
    if (!items || !items.length) return '<span class="none">—</span>';
    return '<ul class="bullets">' + items.map(i => `<li>${esc(i)}</li>`).join('') + '</ul>';
  }

  const tbody = document.getElementById('results-body');
  if (!DATA.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No meetings processed yet.</td></tr>';
  } else {
    tbody.innerHTML = DATA.map(r => `
      <tr>
        <td class="date-col"><span class="date-badge">${esc(r.date || '—')}</span></td>
        <td class="name-col"><span class="name-badge">${esc(r.meeting_name || '—')}</span></td>
        <td class="disc-col">${bulletList(r.discussion)}</td>
        <td class="acts-col">${bulletList(r.my_action_items)}</td>
      </tr>`).join('');
  }
</script>
</body>
</html>
